name: Python Unit tests

on:
  push:
    branches: [ main ]
    paths:
      - "**.py"
      - "frontend/**"
      - "src/uv.lock"
      - "src/pyproject.toml"
      - ".github/workflows/python-unit-test.yaml"

  pull_request:
    branches: [ main ]
    paths:
      - "**.py"
      - "frontend/**"
      - "src/uv.lock"
      - "src/pyproject.toml"
      - ".github/workflows/python-unit-test.yaml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_package:

    name: Test ${{ matrix.os }} Python ${{ matrix.python_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python_version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Setup python
          uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
          with:
            python-version: ${{ matrix.python_version }}
            architecture: x64
        - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
          with:
            enable-cache: true
        - name: Setup node
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
            node-version: 22
        - name: Build frontend
          run: |
            cd ./frontend
            npm install
            npm run build
        - name: Install dependencies
          run: |
            uv sync --directory src --group dev
        - name: Run tests
          run: uv run --project src pytest --cov
        - name: Run E2E tests with Playwright
          id: e2e
          run: |
            uv run --active --project src playwright install chromium --with-deps
            uv run --project src pytest tests/e2e.py --tracing=retain-on-failure
        - name: Upload test artifacts
          if: ${{ failure() && steps.e2e.conclusion == 'failure' }}
          uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
          with:
            name: playwright-traces-${{ matrix.python_version }}
            path: test-results
