name: Python Unit tests

on:
  push:
    branches: [ main ]
    paths:
      - "**.py"
      - "frontend/**"
      - "src/uv.lock"
      - "src/pyproject.toml"
      - ".github/workflows/python-unit-test.yaml"

  pull_request:
    branches: [ main ]
    paths:
      - "**.py"
      - "frontend/**"
      - "src/uv.lock"
      - "src/pyproject.toml"
      - ".github/workflows/python-unit-test.yaml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_package:

    name: Test ${{ matrix.os }} Python ${{ matrix.python_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python_version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Setup python
          uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
          with:
            python-version: ${{ matrix.python_version }}
            architecture: x64
        - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
          with:
            enable-cache: true
        - name: Setup node
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
          with:
            node-version: 22
        - name: Build frontend
          run: |
            cd ./frontend
            npm install
            npm run build
        - name: Install dependencies
          run: |
            uv sync --directory src --group dev
        - name: Run tests
          run: uv run --project src pytest --cov
        - name: Run E2E tests with Playwright
          id: e2e
          run: |
            uv run --active --project src playwright install chromium --with-deps
            uv run --project src pytest tests/e2e.py --tracing=retain-on-failure
        - name: Upload test artifacts
          if: ${{ failure() && steps.e2e.conclusion == 'failure' }}
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          with:
            name: playwright-traces-${{ matrix.python_version }}
            path: test-results
