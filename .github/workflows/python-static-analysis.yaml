name: Python Static Analysis

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - '.github/workflows/python-static-analysis.yaml'

  pull_request:
    branches: [ main ]
    paths:
      - '**.py'
      - '.github/workflows/python-static-analysis.yaml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
    check-static-analysis:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7.0.1
        - uses: actions/setup-python@v6.3.0
          with:
                python-version: 3.12
        - uses: astral-sh/setup-uv@v8.3.2
          with:
                enable-cache: true
        - name: Install dependencies
          run: |
            uv sync --directory src --group lint
        - name: Check mypy
          run: |
            uv run --project src mypy .
